
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pms_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pms_local_password}
      POSTGRES_DB: pms
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pms_app -d pms"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # S3-compatible object storage (RustFS)
  minio:
    image: rustfs/rustfs:latest
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY:-rustfsadmin}
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "127.0.0.1:8082:8080"
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://pms_app:${POSTGRES_PASSWORD:-pms_local_password}@db:5432/pms?sslmode=disable
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-dev-secret-change-me-0123456789abcdef}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-ChangeMe-123456}

      STORAGE_DRIVER: s3
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_PUBLIC_ENDPOINT: http://localhost:9000
      STORAGE_BUCKET: pms-images
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-rustfsadmin}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-rustfsadmin}
      STORAGE_USE_PATH_STYLE: "true"
      STORAGE_AUTO_CREATE_BUCKET: "true"

      RATE_LIMIT_AUTH_PER_MIN: "30"
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
